<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grant | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  /* Reference: 1440 x 900 pt homepage. Sizes use vw so the hero keeps its proportions. */
  :root {
    --ink: #231f20;
    --serif: 'Libre Caslon Text', 'Adobe Caslon Pro', 'Times New Roman', serif;
    --script: 'Pinyon Script', 'Filmotype Yale', cursive;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--serif); color: var(--ink); background: var(--ink); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }

  /* ---------- Navigation (matches reference bar) ---------- */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: var(--ink);
    height: 76px;
    display: flex; align-items: center; justify-content: center;
    gap: clamp(28px, 8.6vw, 124px);
    padding: 0 24px;
  }
  nav a {
    color: #fff; text-decoration: none;
    font-size: clamp(16px, 1.95vw, 30px);
    letter-spacing: 0.01em;
  }
  nav a:hover, nav a:focus-visible { text-decoration: underline; text-underline-offset: 6px; }

  /* ---------- Hero (matches reference page) ---------- */
  .hero {
    position: relative;
    height: calc(100vh - 76px);
    min-height: 640px;
    background: #2a2420 url('hero.jpg') center 54% / cover no-repeat;
    color: #fff;
    overflow: hidden;
  }
  .hero h1 {
    position: absolute; top: 3.8vw; right: 2.5vw;
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(48px, 8.9vw, 170px);
    line-height: 1; text-align: right; white-space: nowrap;
  }
  .hero .script {
    position: absolute; top: 16vw; right: 2.2vw;
    font-family: var(--script); font-weight: 400;
    font-size: clamp(48px, 8.3vw, 170px);
    line-height: 1; white-space: nowrap;
  }
  .hero .tagline {
    position: absolute; right: 2.5vw; bottom: 3vw;
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(26px, 3.75vw, 60px);
    line-height: 1.1; text-align: right;
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 760px) {
    nav { height: auto; flex-wrap: wrap; padding: 14px 12px; gap: 6px 22px; }
    .hero { height: auto; min-height: 92vh; padding: 130px 20px 40px; display: flex; flex-direction: column; justify-content: flex-end; }
    .hero { background-size: cover; background-position: center 40%; }
    .hero h1, .hero .script, .hero .tagline { position: static; text-align: right; white-space: normal; }
    .hero .script { margin-top: -8px; }
    .hero .tagline { margin-top: 18px; font-size: 26px; }
  }
</style>
</head>
<body>

<nav aria-label="Primary">
  <a href="#about">About Me</a>
  <a href="#writing">Writing</a>
  <a href="#broadcast">Broadcast</a>
  <a href="#design">Design</a>
  <a href="#contact">Contact</a>
</nav>

<header class="hero" role="img" aria-label="Grant standing in front of a stone chapel with a staircase and flowers">
  <h1>Welcome to my</h1>
  <div class="script">portfolio.</div>
  <p class="tagline">I’m a student journalist<br>and designer.</p>
</header>

</body>
</html>
